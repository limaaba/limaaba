<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="YONLI Limaaba — Développeur Full-Stack Laravel et React" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.88" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#2c9cdb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2c9cdb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#ff2d20" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2d20" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .in { opacity: 0; animation: up 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; }
    .d3 { animation-delay: 0.6s; } .d4 { animation-delay: 0.85s; }
    .d5 { animation-delay: 1.1s; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .in { opacity: 1; animation: none; }
      .cursor, .pulse { animation: none; }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowBlue)"/>
    <rect width="1200" height="320" fill="url(#glowRed)"/>
  </g>

  <!-- Texte principal -->
  <text x="80" y="92" class="mono in d1" font-size="18" fill="#7dd3fc">~/limaaba $ whoami</text>
  <text x="78" y="162" class="sans in d2" font-size="64" font-weight="700" fill="#ffffff">YONLI Limaaba</text>
  <text x="80" y="208" class="sans in d3" font-size="26" fill="#cbd5e1">Développeur Full-Stack · Laravel &amp; React</text>

  <g class="in d4">
    <circle cx="88" cy="251" r="6" fill="#22c55e" class="pulse"/>
    <text x="104" y="257" class="sans" font-size="18" fill="#94a3b8">Basé au Burkina Faso · Ouvert aux collaborations</text>
  </g>

  <!-- Carte de code décorative -->
  <g class="in d5">
    <rect x="790" y="78" width="330" height="170" rx="14" fill="#0b1a20" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="814" cy="102" r="6" fill="#ff5f57"/>
    <circle cx="834" cy="102" r="6" fill="#febc2e"/>
    <circle cx="854" cy="102" r="6" fill="#28c840"/>
    <text x="814" y="146" class="mono" font-size="16">
      <tspan fill="#7dd3fc">$api</tspan><tspan fill="#e2e8f0"> = </tspan><tspan fill="#ff6b5e">Laravel</tspan><tspan fill="#e2e8f0">::build();</tspan>
    </text>
    <text x="814" y="176" class="mono" font-size="16">
      <tspan fill="#7dd3fc">$ui</tspan><tspan fill="#e2e8f0">  = </tspan><tspan fill="#61dafb">React</tspan><tspan fill="#e2e8f0">::render();</tspan>
    </text>
    <text x="814" y="206" class="mono" font-size="16">
      <tspan fill="#c4b5fd">ship</tspan><tspan fill="#e2e8f0">($api, $ui);</tspan>
    </text>
    <rect x="960" y="192" width="9" height="18" fill="#7dd3fc" class="cursor"/>
  </g>
</svg>
