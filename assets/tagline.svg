<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Je conçois et développe des applications web complètes, de l'API Laravel à l'interface React. Du modèle de données au déploiement, je livre des produits rapides, sécurisés et faciles à maintenir." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#2c9cdb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2c9cdb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d20"/>
      <stop offset="1" stop-color="#61dafb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="240" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect width="1200" height="240" fill="url(#glow)"/>
    <!-- reflet qui balaie la carte en boucle -->
    <rect x="-400" y="0" width="300" height="240" fill="url(#shine)">
      <animate attributeName="x" values="-400;1300;1300" keyTimes="0;0.4;1" dur="7s" begin="3.48s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="80" font-size="32" font-weight="700" fill="#ffffff"><tspan opacity="0">Je <animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">conçois <animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">et <animate attributeName="opacity" from="0" to="1" begin="0.54s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">développe <animate attributeName="opacity" from="0" to="1" begin="0.66s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">des <animate attributeName="opacity" from="0" to="1" begin="0.78s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">applications <animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">web <animate attributeName="opacity" from="0" to="1" begin="1.02s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">complètes, <animate attributeName="opacity" from="0" to="1" begin="1.14s" dur="0.45s" fill="freeze"/></tspan></text>
    <text x="600" y="124" font-size="32" font-weight="700" fill="#ffffff"><tspan opacity="0">de <animate attributeName="opacity" from="0" to="1" begin="1.26s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">l'API <animate attributeName="opacity" from="0" to="1" begin="1.38s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0" fill="#ff6b5e">Laravel <animate attributeName="opacity" from="0" to="1" begin="1.50s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">à <animate attributeName="opacity" from="0" to="1" begin="1.62s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0">l'interface <animate attributeName="opacity" from="0" to="1" begin="1.74s" dur="0.45s" fill="freeze"/></tspan><tspan opacity="0" fill="#61dafb">React. <animate attributeName="opacity" from="0" to="1" begin="1.86s" dur="0.45s" fill="freeze"/></tspan></text>

    <rect x="600" y="148" width="0" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="x" from="600" to="520" begin="2.08s" dur="0.6s" fill="freeze"/>
      <animate attributeName="width" from="0" to="160" begin="2.08s" dur="0.6s" fill="freeze"/>
    </rect>

    <text x="600" y="196" font-size="20" fill="#cbd5e1" opacity="0">Du modèle de données au déploiement, je livre des produits rapides, sécurisés et faciles à maintenir.<animate attributeName="opacity" from="0" to="1" begin="2.48s" dur="0.8s" fill="freeze"/></text>
  </g>
</svg>
